# US apparel storefronts scraped daily from GitHub Actions (US IP).
#
# Probe runs on 3 October 2026 showed that most large brand sites block cloud
# servers outright (Akamai / PerimeterX / Cloudflare "Access Denied"): Louis
# Vuitton, Gucci, Ralph Lauren, Tommy Hilfiger, Calvin Klein, Levi's, H&M, Zara,
# Uniqlo, Coach, Michael Kors, Abercrombie, Columbia, lululemon, Nordstrom,
# Lands' End, SSENSE, Mytheresa, SHEIN. They are listed under `blocked` below so
# the record is kept. Getting them would need a residential proxy (paid).
#
# The sites below loaded, served USD prices and passed a product-page test.
# Note that US sites almost always label origin only as "Imported"; Burberry is
# the exception and states "made in <country>" in product details.
#
# Fields: key, parent (listed parent), segment, listing_urls, product_url_re,
# max_products (fixed panel followed daily; 50 keeps a daily run under the
# 2,000 free Actions minutes a month for a private repo).

retailers:
  - key: burberry
    name: Burberry US
    parent: Burberry Group
    segment: luxury
    listing_urls:
      - https://us.burberry.com/l/mens-clothing/
      - https://us.burberry.com/l/womens-clothing/
    product_url_re: 'burberry\.com/.+-p\d+'
    max_products: 50

  - key: jcrew
    name: J.Crew US
    parent: J.Crew Group (private)
    segment: premium
    listing_urls:
      - https://www.jcrew.com/plp/mens/categories/clothing
      - https://www.jcrew.com/plp/womens/categories/clothing
    product_url_re: 'jcrew\.com/p/'
    max_products: 50

  - key: banana_republic
    name: Banana Republic US
    parent: Gap Inc
    segment: premium
    listing_urls:
      - https://bananarepublic.gap.com/browse/category.do?cid=1158705
      - https://bananarepublic.gap.com/browse/women/cashmere-shop?cid=3011914
    product_url_re: 'bananarepublic\.gap\.com/browse/product\.do\?pid=\d+'
    max_products: 50

  - key: everlane
    name: Everlane US
    parent: Everlane (private)
    segment: premium
    listing_urls:
      - https://www.everlane.com/collections/mens-tees
      - https://www.everlane.com/collections/womens-new-arrivals
    product_url_re: 'everlane\.com/products/'
    max_products: 50

  - key: athleta
    name: Athleta US
    parent: Gap Inc
    segment: premium
    listing_urls:
      - https://athleta.gap.com/browse/new/all-womens?cid=3043230
      - https://athleta.gap.com/browse/category.do?cid=1006482
      - https://athleta.gap.com/browse/new/yoga-and-studio?cid=46693
      - https://athleta.gap.com/browse/new/run-and-train?cid=46711
    product_url_re: 'athleta\.gap\.com/browse/product\.do\?pid=\d+'
    max_products: 50

  - key: gap
    name: Gap US
    parent: Gap Inc
    segment: mass
    listing_urls:
      - https://www.gap.com/browse/category.do?cid=1127944
      - https://www.gap.com/browse/category.do?cid=1014747
      - https://www.gap.com/browse/category.do?cid=5664
    product_url_re: 'gap\.com/browse/product\.do\?pid=\d+'
    max_products: 50

  - key: american_eagle
    name: American Eagle US
    parent: American Eagle Outfitters
    segment: mass
    listing_urls:
      - https://www.ae.com/us/en/c/men/jeans/cat6430041
      - https://www.ae.com/us/en
    product_url_re: 'ae\.com/us/en/p/'
    max_products: 50

  - key: old_navy
    name: Old Navy US
    parent: Gap Inc
    segment: fast_fashion
    listing_urls:
      - https://oldnavy.gap.com/browse/category.do?cid=55474
      - https://oldnavy.gap.com/browse/category.do?cid=1091018
      - https://oldnavy.gap.com/browse/category.do?cid=1109216
    product_url_re: 'oldnavy\.gap\.com/browse/product\.do\?pid=\d+'
    max_products: 50

candidates: []


name: collect-artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: run whose artifacts to collect
        required: true
      dest:
        description: folder on probe-logs branch
        required: true
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: collected
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          ref: probe-logs
          path: logs
      - run: |
          mkdir -p "logs/${{ inputs.dest }}" && cp -r collected/* "logs/${{ inputs.dest }}/"
          cd logs && git config user.name "probe-bot" && git config user.email "probe-bot@users.noreply.github.com"
          git add -A && git commit -m "collect artifacts of run ${{ inputs.run_id }}" || true
          git push origin HEAD:probe-logs
